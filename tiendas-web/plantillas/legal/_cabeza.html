<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITULO@@ | {{tienda.nombre}}</title>
<meta name="description" content="@@DESC@@">
<link rel="canonical" href="{{tienda.sitio}}/@@RUTA@@">
<meta property="og:site_name" content="{{tienda.nombre}}"><meta property="og:locale" content="es_MX"><meta property="og:type" content="website">
<meta property="og:title" content="@@TITULO@@ | {{tienda.nombre}}"><meta property="og:description" content="@@DESC@@">
<meta property="og:image" content="{{tienda.sitio}}/img/logo.png">
<link rel="icon" type="image/png" href="/img/icono.png">
<style>
:root{--lima:{{tienda.colores.acento}};--azul:{{tienda.colores.primario}};--bg:{{tienda.colores.fondo}};--card:{{tienda.colores.tarjeta}};--texto:{{tienda.colores.texto}};--suave:{{tienda.colores.suave}};--borde:{{tienda.colores.borde}}}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--texto);line-height:1.65}
header{background:var(--card);border-bottom:1px solid var(--borde);padding:14px 16px}
header img{height:28px}
main{max-width:780px;margin:0 auto;padding:24px 16px 64px}
h1{font-weight:800;font-size:1.8rem;margin:.2em 0 .1em}
h2{font-size:1.1rem;margin:1.8em 0 .4em;color:var(--lima)}
p,li{color:var(--texto)}
a{color:var(--lima)}
.suave{color:var(--suave);font-size:.9rem}
.caja{background:var(--card);border:1px solid var(--borde);border-radius:12px;padding:14px 16px}
.legal-nav{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;margin-bottom:18px}.legal-nav a{color:var(--suave)}.legal-nav a:hover{color:var(--lima)}
ul.datos{list-style:none;padding:0}ul.datos li{margin:2px 0}
</style>
</head>
<body>
<header><a href="/"><img src="/img/logo.png" alt="{{tienda.nombre}}"></a></header>
<main>
  <nav class="legal-nav">{{html:tienda._enlacesLegales}}</nav>
